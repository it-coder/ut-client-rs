[package]
name = "ut-client"
version = "0.1.0"
edition = "2021"
description = "Uptime Kuma 拨测任务清理 CLI 工具"
authors = ["lih"]

[[bin]]
name = "ut-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# 关闭默认特性（color / suggestions），只保留 derive + help/usage
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage"] }
log = "0.4"
kuma-client = "2.0.0"
rpassword = "7"
# 只开实际用到的异步运行时特性（kuma-client 侧已同步裁剪，见 vendor）
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# 仅对 cross 交叉编译的 aarch64 Linux 静态编入 OpenSSL（vendored）：
# 容器内没有目标架构的 openssl-dev，pkg-config 找不到 openssl.pc 会直接失败，
# vendored 从源码编译可绕开，且产物不依赖运行时 libssl/libcrypto。
# x86_64-unknown-linux-gnu 在原生 runner 上编译，用系统 OpenSSL 动态链接即可
# （静态编入会令二进制从约 2MB 涨到 8MB），运行时需 glibc 环境装有 libssl3。
[target.aarch64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
# 体积优化：z 优先压体积；abort 去掉 unwind 表；strip 去掉符号；单 CGU + fat LTO 便于跨 crate 裁剪
opt-level = "z"
panic = "abort"
strip = "symbols"
lto = true
codegen-units = 1

# 本地补丁：修复 kuma-client 2.0.0 无法反序列化新版 Uptime Kuma 返回的大写
# HttpBodyEncoding（"JSON"/"FORM"/"XML"）导致 MonitorList 解析 panic 的问题。
# 补丁内容见 vendor/kuma-client/src/models/monitor.rs。
[patch.crates-io]
kuma-client = { path = "vendor/kuma-client" }
