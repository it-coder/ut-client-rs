name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（glibc，构建于 ubuntu-22.04 以兼容较老发行版）
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
          # Linux aarch64（glibc，经 cross 容器交叉编译）
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          # Windows x86_64 (MSVC)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # kuma-client 依赖 native-tls -> openssl；Linux 目标已启用 vendored（见 Cargo.toml），
      # 静态编译 OpenSSL，无需在 CI 安装 libssl-dev，也不依赖运行时的 libssl。
      # x86_64 Linux 原生编译走系统 OpenSSL（动态链接，二进制更小）；
      # aarch64 cross 与 vendored 静态编译，均无需宿主机 libssl。
      - name: Install OpenSSL (Linux, non-cross)
        if: ${{ runner.os == 'Linux' && !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/ut-client-${{ steps.ver.outputs.version }}-${{ matrix.target }}.tar.gz" ut-client

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/ut-client.exe" `
            -DestinationPath "ut-client-${{ steps.ver.outputs.version }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ut-client-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: ut-client-*${{ matrix.target }}.*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ut-client-*${{ matrix.target }}.*
