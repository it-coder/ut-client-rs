# cross 交叉编译配置
# kuma-client 依赖 native-tls -> openssl-sys，交叉编译 aarch64 时容器内缺少
# arm64 版 OpenSSL 开发包，pkg-config 找不到 openssl.pc。
# 通过 pre-build 钩子在容器内安装目标架构的 libssl-dev。
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libssl-dev:$CROSS_DEB_ARCH",
]
